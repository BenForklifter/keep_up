name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        # Everything but the speech recognizer, which the tests don't use
        run: |
          grep -v '^sherpa-onnx' python/requirements.txt > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt" pytest==8.4.1 ruff==0.12.0
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
